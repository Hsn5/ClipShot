name: Build ClipShot APK

on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Locate Project & Build
        run: |
          SETTINGS_PATH=$(find . -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_PATH" ]; then
            SETTINGS_PATH=$(find . -name "settings.gradle" | head -n 1)
          fi

          if [ -n "$SETTINGS_PATH" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_PATH")
            cd "$PROJECT_DIR"
            gradle wrapper --gradle-version 8.5
            chmod +x gradlew
            ./gradlew :app:assembleDebug --stacktrace
          else
            echo "ERROR: No settings.gradle found in repo!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipShot-Debug-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
